<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Webcam Feed</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    transform: scaleX(-1);
    filter: grayscale(1) contrast(1.3) brightness(1.05);
  }
  /* static CRT-style scanline texture */
  #scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.35) 0px,
      rgba(0,0,0,0.35) 1px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0) 3px
    );
    mix-blend-mode: multiply;
  }
  /* bright sweeping scan line */
  #sweep {
    position: fixed;
    left: 0;
    right: 0;
    height: 6vh;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.25) 50%,
      rgba(255,255,255,0) 100%
    );
    animation: sweep-move 4s linear infinite;
  }
  @keyframes sweep-move {
    0%   { top: -6vh; }
    100% { top: 100vh; }
  }
  #error {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="scanlines"></div>
  <div id="sweep"></div>
  <div id="error"></div>

  <script>
    const video = document.getElementById('video');
    const errorEl = document.getElementById('error');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        errorEl.textContent = 'Could not access camera: ' + err.message;
        errorEl.style.display = 'flex';
      }
    }

    startCamera();
  </script>
</body>
</html>
