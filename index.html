<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Webcam Feed</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video {
    position: fixed;
    top: -9999px;
    left: -9999px;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    transform: scaleX(-1);
  }
  #error {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="error"></div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const errorEl = document.getElementById('error');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const STEP = 6; // pixels of new footage drawn per frame

    function renderSlitScan() {
      // scroll existing image left by STEP pixels
      ctx.drawImage(canvas, -STEP, 0);
      // draw a fresh STEP-pixel-wide slice of the current camera frame on the right edge,
      // so each x position across the screen is a different moment in time
      const sx = video.videoWidth / 2 - STEP / 2;
      ctx.drawImage(
        video,
        sx, 0, STEP, video.videoHeight,
        canvas.width - STEP, 0, STEP, canvas.height
      );
      requestAnimationFrame(renderSlitScan);
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
          renderSlitScan();
        }, { once: true });
      } catch (err) {
        errorEl.textContent = 'Could not access camera: ' + err.message;
        errorEl.style.display = 'flex';
      }
    }

    startCamera();
  </script>
</body>
</html>
