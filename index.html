<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Webcam Feed</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    background: #0b0d10;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 1rem;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0;
  }
  #video-wrap {
    position: relative;
    width: min(90vw, 720px);
    aspect-ratio: 4 / 3;
    background: #16191d;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* mirror, feels more natural */
  }
  #status {
    font-size: 0.9rem;
    color: #9aa0a6;
    text-align: center;
    max-width: 480px;
  }
  #status.error {
    color: #ff6b6b;
  }
  button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled {
    background: #3a3f47;
    cursor: default;
  }
</style>
</head>
<body>
  <h1>Live Webcam Feed</h1>
  <div id="video-wrap">
    <video id="video" autoplay playsinline muted></video>
  </div>
  <button id="start-btn">Start camera</button>
  <p id="status">Click "Start camera" and allow access to see your own live webcam feed. Nothing is recorded or sent anywhere — the video stays in your browser.</p>

  <script>
    const video = document.getElementById('video');
    const startBtn = document.getElementById('start-btn');
    const status = document.getElementById('status');

    async function startCamera() {
      status.classList.remove('error');
      status.textContent = 'Requesting camera access…';
      startBtn.disabled = true;

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status.classList.add('error');
        status.textContent = 'Your browser does not support camera access (getUserMedia).';
        startBtn.disabled = false;
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;
        status.textContent = 'Live — this is your own camera, streaming locally in your browser.';
        startBtn.textContent = 'Camera running';
      } catch (err) {
        status.classList.add('error');
        status.textContent = 'Could not access camera: ' + err.message;
        startBtn.disabled = false;
      }
    }

    startBtn.addEventListener('click', startCamera);
  </script>
</body>
</html>
